<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D Model Viewer</title>
<link rel="stylesheet" href="styles.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.149.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.149.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<header id="topbar">
  <div class="brand"><span class="dot"></span>3D Model Viewer</div>

  <div class="tools">
    <button class="btn primary" id="btn-open" title="Open a 3D model from this computer">📂 Open</button>
    <button class="btn" id="btn-url" title="Load a model from a web link">🔗 Open URL</button>
    <button class="btn" id="btn-share" title="Copy a link to this model and camera view">📤 Share</button>

    <div class="menu" id="menu-move">
      <button class="btn menu-btn" title="How the mouse moves the view">🖐 Move ▾</button>
      <div class="menu-list">
        <button data-move="orbit" class="active">✓ Orbit — drag to rotate</button>
        <button data-move="pan">Pan — drag to slide</button>
        <button data-move="zoom">Zoom — drag up / down</button>
        <div class="menu-sep"></div>
        <button id="btn-fit-model">⤢ Fit model <span class="kbd">F</span></button>
        <button id="btn-zoom-sel">🔎 Zoom to selection</button>
        <button id="btn-home">⌂ Home view <span class="kbd">H</span></button>
        <div class="menu-sep"></div>
        <label class="menu-check"><input type="checkbox" id="toggle-grid" checked /> Show grid</label>
        <div class="menu-slider"><label>Cell</label><input type="number" id="grid-cell" step="0.05" min="0.001" value="1" title="Grid spacing in model units" /></div>
        <div class="menu-slider"><label>Extent</label><input type="number" id="grid-extent" step="1" min="1" value="100" title="Overall grid width in model units" /></div>
        <label class="menu-check"><input type="checkbox" id="grid-auto" checked /> Auto grid (fit model)</label>
        <label class="menu-check"><input type="checkbox" id="toggle-shadow" checked /> Show shadows</label>
        <label class="menu-check"><input type="checkbox" id="toggle-rot" /> Auto-rotate</label>
      </div>
    </div>

    <div class="menu" id="menu-display">
      <button class="btn menu-btn" title="How the model is drawn">🎨 Display ▾</button>
      <div class="menu-list">
        <button id="gdo-open">🖼 Graphic Display Options…</button>
        <div class="menu-sep"></div>
        <button data-style="wireframe">Wireframe</button>
        <button data-style="hidden">Hidden Line</button>
        <button data-style="shaded" class="active">✓ Shaded</button>
        <button data-style="consistent">Consistent Colors</button>
        <button data-style="textures">Textures</button>
        <button data-style="realistic">Realistic</button>
        <div class="menu-sep"></div>
        <div id="gdo-panel" hidden>
          <div class="menu-slider"><label>Background</label>
            <span class="sw-row">
              <button class="sw" data-bg="dark" title="Dark"></button>
              <button class="sw" data-bg="grey" title="Grey"></button>
              <button class="sw" data-bg="white" title="White"></button>
            </span>
          </div>
          <label class="menu-check"><input type="checkbox" id="toggle-edges" /> Show edges</label>
        </div>
      </div>
    </div>

    <div class="menu" id="menu-views">
      <button class="btn menu-btn">🧭 Views ▾</button>
      <div class="menu-list">
        <button data-view="iso" class="active">✓ Isometric</button>
        <button data-view="top">Top</button>
        <button data-view="bottom">Bottom</button>
        <button data-view="front">Front</button>
        <button data-view="back">Back</button>
        <button data-view="left">Left</button>
        <button data-view="right">Right</button>
        <div class="menu-sep"></div>
        <button data-proj="persp" class="proj active">✓ Perspective</button>
        <button data-proj="ortho" class="proj">Orthographic</button>
      </div>
    </div>

    <div class="menu" id="menu-section">
      <button class="btn menu-btn">✂ Section ▾</button>
      <div class="menu-list">
        <button data-axis="off" class="active">✓ Off</button>
        <button data-axis="x">Clip X axis</button>
        <button data-axis="y">Clip Y (horizontal)</button>
        <button data-axis="z">Clip Z axis</button>
        <button data-axis="box">Box clip (crop region)</button>
        <div class="menu-sep"></div>
        <div id="axis-controls" hidden>
          <div class="menu-slider">
            <label>Position</label>
            <input type="range" id="clip-range" min="0" max="100" value="50" />
          </div>
          <label class="menu-check"><input type="checkbox" id="clip-flip" /> Flip side</label>
        </div>
        <div id="box-controls" hidden>
          <div class="menu-slider"><label>X min</label><input type="range" id="box-xmin" min="0" max="100" value="0" /></div>
          <div class="menu-slider"><label>X max</label><input type="range" id="box-xmax" min="0" max="100" value="100" /></div>
          <div class="menu-slider"><label>Y min</label><input type="range" id="box-ymin" min="0" max="100" value="0" /></div>
          <div class="menu-slider"><label>Y max</label><input type="range" id="box-ymax" min="0" max="100" value="100" /></div>
          <div class="menu-slider"><label>Z min</label><input type="range" id="box-zmin" min="0" max="100" value="0" /></div>
          <div class="menu-slider"><label>Z max</label><input type="range" id="box-zmax" min="0" max="100" value="100" /></div>
          <button class="btn small" id="box-reset">↺ Reset box</button>
        </div>
      </div>
    </div>

    <div class="menu" id="menu-select">
      <button class="btn menu-btn">◉ Select ▾</button>
      <div class="menu-list">
        <button data-selmode="element" class="active">✓ Single part</button>
        <button data-selmode="parent">Whole assembly</button>
        <button data-selmode="type">All of same type</button>
        <div class="menu-sep"></div>
        <label class="menu-check"><input type="checkbox" id="multi-select" /> Multi-select (Ctrl+click)</label>
        <div class="menu-sep"></div>
        <button id="btn-isolate">👁 Isolate selection</button>
        <button id="btn-showall">Show all</button>
      </div>
    </div>

    <button class="btn" id="btn-walk" title="First-person walk-through">🚶 Walk</button>
    <button class="btn" id="btn-fit" title="Fit model in view (F)">⤢ Fit</button>
    <button class="btn" id="btn-formats" title="Which file formats can I open?">ℹ Formats</button>
    <input id="search" type="search" placeholder="Search name / ID / type…" />
  </div>
</header>

<main>
  <aside id="side">
    <div class="tabs">
      <button data-tab="tree" class="tab active">Model</button>
      <button data-tab="props" class="tab">Properties</button>
    </div>
    <div class="pane" id="pane-tree"><div class="tree" id="tree">No model loaded.</div></div>
    <div class="pane" id="pane-props" hidden><div class="props" id="props">Nothing selected.</div></div>
  </aside>

  <div id="viewport">
    <canvas id="c"></canvas>

    <div id="empty-hint">Drop a 3D model here, or click <b>📂 Open</b></div>

    <div id="start" class="overlay-card" hidden>
      <button class="card-close" id="start-close" title="Close">✕</button>
      <h1>Visualise and explore 3D models</h1>
      <p>Drop a file here, or open one. Supported formats:</p>
      <div class="chips" id="chips"></div>
      <p class="hint">Everything runs in your browser — files are never uploaded.</p>
    </div>

    <div id="drop" class="drop-hint" hidden><div>Drop to open</div></div>
    <div id="loader" class="loading" hidden><span class="spinner"></span><span id="loader-msg">Loading…</span></div>
    <div id="toast" class="toast" hidden></div>
    <div id="badge" class="badge" hidden></div>

    <div id="viewcube" title="Drag to orbit — click a face">
      <div class="vc-stage">
        <div class="vc-cube" id="vc-cube">
          <div class="vc-face vc-front" data-view="front">FRONT</div>
          <div class="vc-face vc-back" data-view="back">BACK</div>
          <div class="vc-face vc-right" data-view="right">RIGHT</div>
          <div class="vc-face vc-left" data-view="left">LEFT</div>
          <div class="vc-face vc-top" data-view="top">TOP</div>
          <div class="vc-face vc-bottom" data-view="bottom">BOTTOM</div>
        </div>
      </div>
      <button class="vc-arrow vc-a-up" data-spin="up" title="Rotate up">▲</button>
      <button class="vc-arrow vc-a-down" data-spin="down" title="Rotate down">▼</button>
      <button class="vc-arrow vc-a-left" data-spin="left" title="Rotate left">◀</button>
      <button class="vc-arrow vc-a-right" data-spin="right" title="Rotate right">▶</button>
    </div>

    <div class="navrail">
      <button class="navbtn on" data-move="orbit" title="Orbit — drag to rotate (1)">⟳</button>
      <button class="navbtn" data-move="pan" title="Pan — drag to slide (2)">✥</button>
      <button class="navbtn" data-move="zoom" title="Zoom — drag up / down (3)">🔍</button>
      <div class="navsep"></div>
      <button class="navbtn" id="rail-fit" title="Fit model (F)">⤢</button>
      <button class="navbtn" id="rail-home" title="Home view (H)">⌂</button>
    </div>

    <div id="statusbar" class="status-pill" hidden><span id="status"></span></div>
  </div>
</main>

<input id="file-input" type="file" multiple hidden />

<script type="module" src="app.js"></script>
</body>
</html>
